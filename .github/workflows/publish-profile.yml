name: Publish profile page

on:
  push:
    branches: [master]
    paths: [README.md, site-template.html, .github/workflows/publish-profile.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const source = fs.readFileSync("README.md", "utf8");
            const publicSource = source.split("\n## How this site is published")[0];
            const { data: body } = await github.rest.markdown.render({ text: publicSource, mode: "gfm", context: `${context.repo.owner}/${context.repo.repo}` });
            const template = fs.readFileSync("site-template.html", "utf8");
            fs.writeFileSync("index.html", template.replace("{{body}}", body));
      - name: Commit generated page
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: regenerate site from README"
          git push
