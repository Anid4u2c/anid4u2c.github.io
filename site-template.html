<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Enterprise application and web tooling engineer.">
  <title>Nick Lalande · Anid4u2c</title>
  <style>
    :root { color-scheme: dark; --ink: #eff6ff; --muted: #b6c5d8; --line: #29415e; --accent: #62d6ff; --surface: #101b2a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: radial-gradient(circle at 10% 5%, #18375b 0, transparent 36rem), #08111d; }
    main { width: min(100% - 2rem, 760px); margin: 0 auto; padding: clamp(5rem, 15vw, 10rem) 0 4rem; }
    article > p:first-child { margin: 0 0 1.1rem; color: var(--accent); font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 13ch; margin: 0; font-size: clamp(3rem, 10vw, 5.8rem); line-height: .96; letter-spacing: -.065em; }
    article > h1 + p { max-width: 43rem; margin: 2rem 0 0; color: var(--muted); font-size: clamp(1.12rem, 2.5vw, 1.35rem); line-height: 1.6; }
    h2 { margin: 4rem 0 1rem; padding-top: 1.35rem; border-top: 1px solid var(--line); font-size: 1rem; letter-spacing: .04em; text-transform: uppercase; }
    ul { display: flex; flex-wrap: wrap; gap: .65rem; margin: 0; padding: 0; list-style: none; }
    li { padding: .55rem .75rem; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--surface) 82%, transparent); color: var(--muted); }
    article > p:last-child { margin-top: 4rem; color: #7e91a8; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <article>
{{body}}
    </article>
  </main>
</body>
</html>
